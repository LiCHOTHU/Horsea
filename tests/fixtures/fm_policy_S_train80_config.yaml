        brightness: 0.3
        contrast: 0.3
        saturation: 0.3
        hue: 0.3
        epsilon: 0.1
      - _target_: imitation.algos.utils.data_augmentation.TranslationAug
        _partial_: true
        translation: 4
        use_image: true
        use_depth: false
    optimizer_factory:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 0.0001
      betas:
      - 0.95
      - 0.999
      eps: 1.0e-08
      weight_decay: 1.0e-06
    abs_action: false
    shape_meta:
      actions:
        actions: 7
      abs_actions:
        abs_actions: 7
      rotation_rep_in: axis_angle
      rotation_rep_in_abs: axis_angle
