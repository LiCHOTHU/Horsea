          - 128
          robot0_eye_in_hand_image:
          - 3
          - 128
          - 128
        depth:
          agentview_depth:
          - 1
          - 128
          - 128
          robot0_eye_in_hand_depth:
          - 1
          - 128
          - 128
        lowdim:
          robot0_eef_pos: 3
          robot0_gripper_qpos: 2
      task:
        type: vector
        dim: 512
    lang_embed_dim: 256
    load_image: true
    load_depth: false
    task_embedding_format: clip
    _target_: imitation.algos.encoders.rgb.RGBEncoder
    image_encoder_factory:
      _target_: imitation.algos.encoders.rgb_modules.ResnetEncoder
      _partial_: true
      output_size: 256
      pretrained: true
      freeze: false
      remove_layer_num: 2
      no_stride: false
      language_fusion: film
      replace_bn_with_gn: false
      do_projection: false
    lowdim_encoder_factory:
      _target_: imitation.algos.utils.mlp_proj.MLPProj
      _partial_: true
      output_size: 256
      num_layers: 1
    share_image_encoder: true
    share_lowdim_encoder: true
    language_fusion: true
  aug:
    _target_: imitation.algos.utils.data_augmentation.DataAugGroup
    _partial_: true
    aug_list:
    - _target_: imitation.algos.utils.data_augmentation.BatchWiseImgColorJitterAug
      _partial_: true
      brightness: 0.3
      contrast: 0.3
      saturation: 0.3
      hue: 0.3
      epsilon: 0.1
    - _target_: imitation.algos.utils.data_augmentation.TranslationAug
      _partial_: true
      translation: 4
      use_image: true
      use_depth: false
  name: fm_policy
  embed_dim: 256
  lowdim_embed_dim: 256
  image_embed_dim: 256
  lang_embed_dim: 256
  abs_action: false
  frame_stack: 1
  eecf: false
