    frame_stack: 1
    shape_meta:
      actions:
        actions: 7
      abs_actions:
        abs_actions: 7
      rotation_rep_in: axis_angle
      rotation_rep_in_abs: axis_angle
      rotation_rep_out: axis_angle
      observation:
        rgb:
          agentview_image:
          - 3
