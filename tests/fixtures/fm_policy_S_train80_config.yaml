          - 1
          - 128
          - 128
        lowdim:
          robot0_eef_pos: 3
          robot0_gripper_qpos: 2
      task:
        type: vector
        dim: 512
    eecf: false
    bimanual: false
    device: cpu
    action_horizon: 8
    chunk_size: 16
    temporal_agg: true
    _target_: imitation.algos.fm_policy.FlowMatchingPolicy
    num_inference_steps: 10
    dropout: 0.1
    feat_norm: layer_norm
    embed_dim: 256
    velocity_net_kwargs:
      time_dim: 128
      hidden_dim: 256
      num_blocks: 4
      dim_feedforward: 512
      dropout: 0.1
      nhead: 4
      activation: gelu
    flow_sampling: beta
    flow_alpha: 1.5
    flow_beta: 1.0
    flow_sig_min: 0.001
  scheduler_kwargs:
    schedule_type: cosine
    warmup_steps: 1000
    lr: 0.0001
    end_factor: 0.01
  dataset:
